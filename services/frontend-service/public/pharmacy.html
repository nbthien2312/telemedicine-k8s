<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>Nhà Thuốc Trực Tuyến</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></head>
<body style="background-color: #f4f7f6;">
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #0d6efd;"><div class="container"><a class="navbar-brand fw-bold" href="index.html">MediCare</a><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Trang Chủ</a></li><li class="nav-item"><a class="nav-link" href="booking.html">Đặt Lịch Khám</a></li><li class="nav-item"><a class="nav-link active" href="pharmacy.html">Nhà Thuốc</a></li><li class="nav-item"><a class="nav-link text-warning fw-bold" href="admin.html">Admin</a></li></ul></div></nav>
  <div class="container mt-5">
    <div class="row justify-content-center"><div class="col-md-8">
      <div class="card shadow-sm border-0 border-top border-primary border-4">
        <div class="card-header bg-white"><h4 class="text-primary mt-2">Nhà Thuốc Trực Tuyến</h4></div>
        <div class="card-body p-4">
          <div class="row mb-3"><div class="col"><label class="form-label text-muted">Tên Người Nhận</label><input type="text" id="custName" class="form-control" ></div><div class="col"><label class="form-label text-muted">SĐT / Email</label><input type="text" id="custContact" class="form-control" ></div></div>
          <div class="row mb-4"><div class="col-md-9"><label class="form-label text-muted">Chọn Sản Phẩm Y Tế</label><select id="productSelect" class="form-select" onchange="calc()"></select></div><div class="col-md-3"><label class="form-label text-muted">Số lượng</label><input type="number" id="qtyInput" class="form-control" value="1" min="1" onchange="calc()"></div></div>
          <div class="d-flex justify-content-between align-items-center bg-light p-3 rounded mb-4">
            <span class="fs-5 text-muted">Tổng thành tiền:</span><span class="fs-3 fw-bold text-danger" id="displayTotal">0 đ</span>
          </div>
          <button onclick="showPayment()" class="btn btn-primary w-100 py-2 fw-bold">THANH TOÁN ĐƠN HÀNG</button>
        </div>
      </div>
    </div></div>
  </div>
  <!-- Modal Thanh Toán -->
  <div class="modal fade" id="paymentModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header bg-primary text-white"><h5 class="modal-title">Thanh Toán Trực Tuyến</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body text-center"><p class="text-muted">Quét mã QR để hoàn tất đơn hàng.</p><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=MediCareOrder" class="img-fluid border p-2 mb-3"><h3 class="text-danger fw-bold" id="modalAmount"></h3></div><div class="modal-footer justify-content-center"><button type="button" class="btn btn-success px-4 fw-bold" onclick="processOrder()">Đã Hoàn Tất Thanh Toán</button></div></div></div></div>
  <script>
    let products = []; let myModal; let currentTotal = 0;
    async function load() {
      products = await fetch('/api/products').then(r=>r.json());
      document.getElementById('productSelect').innerHTML = products.map(p=>`<option value="${p.id}" data-price="${p.price}">${p.name} - ${p.price.toLocaleString()}đ</option>`).join('');
      calc();
    }
    function calc() {
      const select = document.getElementById('productSelect'); const price = select.options[select.selectedIndex].getAttribute('data-price');
      currentTotal = price * document.getElementById('qtyInput').value;
      document.getElementById('displayTotal').innerText = currentTotal.toLocaleString() + ' VNĐ';
    }
    function showPayment() {
      if(!document.getElementById('custName').value) return alert("Vui lòng nhập tên người nhận!");
      document.getElementById('modalAmount').innerText = currentTotal.toLocaleString() + ' VNĐ';
      myModal = new bootstrap.Modal(document.getElementById('paymentModal')); myModal.show();
    }
    async function processOrder() {
      await fetch('/api/orders', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ customerName: document.getElementById('custName').value, contactInfo: document.getElementById('custContact').value, productId: document.getElementById('productSelect').value, quantity: document.getElementById('qtyInput').value }) });
      myModal.hide(); alert("🎉 Mua thuốc thành công! Đơn hàng đang được xử lý."); window.location.reload();
    }
    load();
  </script>
</body></html>
