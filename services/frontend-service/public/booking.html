<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>Đặt Lịch Khám</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></head>
<body style="background-color: #f4f7f6;">
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #0d6efd;"><div class="container"><a class="navbar-brand fw-bold" href="index.html">MediCare</a><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Trang Chủ</a></li><li class="nav-item"><a class="nav-link active" href="booking.html">Đặt Lịch Khám</a></li><li class="nav-item"><a class="nav-link" href="pharmacy.html">Nhà Thuốc</a></li><li class="nav-item"><a class="nav-link text-warning fw-bold" href="admin.html">Admin</a></li></ul></div></nav>
  <div class="container mt-5">
    <div class="row justify-content-center"><div class="col-md-7">
      <div class="card shadow-sm border-0 border-top border-primary border-4">
        <div class="card-header bg-white"><h4 class="text-primary mt-2">Đăng Ký Khám Bệnh</h4></div>
        <div class="card-body p-4">
          <div class="row mb-3"><div class="col"><label class="form-label text-muted">Họ và Tên</label><input type="text" id="patientName" class="form-control" ></div><div class="col"><label class="form-label text-muted">SĐT / Email liên hệ</label><input type="text" id="contactInfo" class="form-control" ></div></div>
          <div class="mb-3"><label class="form-label text-muted">Chọn Chuyên Khoa & Bác Sĩ</label><select id="clinicSelect" class="form-select">
            <option value="Khoa Nội - BS. Lê Hoàng">Khoa Nội Tổng Quát - BS. Lê Hoàng</option><option value="Khoa Tim Mạch - BS. Trần B">Khoa Tim Mạch Chuyên Sâu - BS. Trần B</option><option value="Khoa Nhi - BS. Nguyễn C">Khoa Nhi & Tiêm Chủng - BS. Nguyễn C</option><option value="Khoa Xương Khớp - BS. Phạm D">Khoa Xương Khớp - BS. Phạm D</option><option value="Khoa Da Liễu - BS. Lê E">Khoa Da Liễu - BS. Lê E</option><option value="Khoa Sản - BS. Trần F">Khoa Phụ Sản - BS. Trần F</option><option value="Khám Tổng Quát VIP">Gói Khám Sức Khỏe Tổng Quát VIP</option>
          </select></div>
          <div class="mb-4"><label class="form-label text-muted">Thời gian khám</label><input type="datetime-local" id="timeInput" class="form-control"></div>
          <button onclick="showPayment()" class="btn btn-primary w-100 py-2 fw-bold">XÁC NHẬN & THANH TOÁN (150.000đ)</button>
        </div>
      </div>
    </div></div>
  </div>
  <!-- Modal Thanh Toán -->
  <div class="modal fade" id="paymentModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header bg-primary text-white"><h5 class="modal-title">Thanh Toán Phí Khám</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body text-center"><p class="text-muted">Quét mã QR qua ứng dụng VNPay / Momo để hoàn tất.</p><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=MediCareBooking" class="img-fluid border p-2 mb-3"><h3 class="text-danger fw-bold">150.000 VNĐ</h3></div><div class="modal-footer justify-content-center"><button type="button" class="btn btn-success px-4 fw-bold" onclick="processBooking()">Đã Hoàn Tất Thanh Toán</button></div></div></div></div>
  <script>
    let myModal;
    function showPayment() { 
      if(!document.getElementById('patientName').value) return alert("Vui lòng nhập tên!");
      myModal = new bootstrap.Modal(document.getElementById('paymentModal')); myModal.show(); 
    }
    async function processBooking() {
      await fetch('/api/bookings', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ patientName: document.getElementById('patientName').value, contactInfo: document.getElementById('contactInfo').value, doctorClinic: document.getElementById('clinicSelect').value, appointmentTime: document.getElementById('timeInput').value }) });
      myModal.hide(); alert("🎉 Đặt lịch thành công! Tin nhắn xác nhận đang được gửi đi."); window.location.reload();
    }
  </script>
</body></html>
