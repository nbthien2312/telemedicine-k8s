apiVersion: apps/v1
kind: Deployment
metadata: { name: user-service, namespace: telemedicine }
spec:
  replicas: 1
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      containers: [ { name: app, image: "user-service:v4", imagePullPolicy: Never, ports: [ { containerPort: 3001 } ] } ]
---
apiVersion: v1
kind: Service
metadata: { name: user-service, namespace: telemedicine }
spec: { selector: { app: user-service }, ports: [ { port: 3001 } ] }
---
