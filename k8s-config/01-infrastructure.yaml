apiVersion: v1
kind: Namespace
metadata:
  name: telemedicine
---
# Cấu hình 1 Container PostgreSQL chứa 5 DB (Tối ưu RAM)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-postgres
  namespace: telemedicine
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_PASSWORD
          value: "secret123"
        - name: POSTGRES_DB
          value: "postgres" # DB mặc định
        ports: [ { containerPort: 5432 } ]
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: telemedicine
spec:
  selector: { app: postgres }
  ports: [ { port: 5432 } ]
---
# Cấu hình Message Broker Redpanda (Tương thích Kafka)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: telemedicine
spec:
  replicas: 1
  selector: { matchLabels: { app: redpanda } }
  template:
    metadata: { labels: { app: redpanda } }
    spec:
      containers:
      - name: redpanda
        image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
        args: [ "redpanda", "start", "--smp=1", "--memory=512M", "--reserve-memory=0M", "--overprovisioned", "--node-id=0", "--kafka-addr=0.0.0.0:9092", "--advertise-kafka-addr=kafka-service:9092" ]
        ports: [ { containerPort: 9092 } ]
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: telemedicine
spec:
  selector: { app: redpanda }
  ports: [ { port: 9092, targetPort: 9092 } ]
